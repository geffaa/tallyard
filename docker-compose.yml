services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tallyard
      POSTGRES_USER: tallyard        # owner: runs migrations
      POSTGRES_PASSWORD: tallyard
    ports: ["5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
